# CI (windows)
#
# Builds and tests the engine on Windows using the project's own
# scripts/build_windows.ps1 (same as the old windows-build.yml): it locates
# the MSVC toolset via vswhere and configures compiler/SDK paths explicitly.
# (Bare `cmake` does not work on the runner: cl is not on PATH, so CMake
# auto-detects the MinGW cc that ships in the image PATH.)
#
#   - cpu:    build + ctest
#   - vulkan: LunarG SDK installed from a pinned URL, build only
#   - cuda:   build only, manual dispatch only (see below)
#
# The cuda job is gated to workflow_dispatch, like llama.cpp's
# build-cuda-windows.yml ("very heavy on the CI"): the runner image ships
# no CUDA toolkit, so the job installs it first. The windows-2025 image
# has no GPU, so this is compile verification only (arch 89, explicit).
# If the choco 'cuda' package misbehaves, fall back to the NVIDIA redist
# zip approach (see llama.cpp's .github/actions/windows-setup-cuda).
#
# ccache is intentionally not used on Windows (MSVC+ccache works, but it is
# unproven here; add later if the jobs get slow).
#
# The old windows-build.yml is kept until this workflow is proven green.

name: CI (windows)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
      - 'ci/**'
    paths:
      - '.github/workflows/ci-windows.yml'
      - 'scripts/build_windows.ps1'
      - '**/CMakeLists.txt'
      - '**/.cmake'
      - '**/*.h'
      - '**/*.hpp'
      - '**/*.c'
      - '**/*.cpp'
      - '**/*.cu'
      - '**/*.cuh'
      - 'model_specs/*.json'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - '.github/workflows/ci-windows.yml'
      - 'scripts/build_windows.ps1'
      - '**/CMakeLists.txt'
      - '**/.cmake'
      - '**/*.h'
      - '**/*.hpp'
      - '**/*.c'
      - '**/*.cpp'
      - '**/*.cu'
      - '**/*.cuh'
      - 'model_specs/*.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VULKAN_SDK_VERSION: 1.4.357.0

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: windows-2025
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cpu (x64)
            preset: windows-cpu-release
            build_tests: "ON"
            run_tests: true
          - name: vulkan (x64)
            preset: windows-vulkan-release
            build_tests: "OFF"
            run_tests: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Vulkan SDK
        if: ${{ matrix.preset == 'windows-vulkan-release' }}
        shell: pwsh
        run: |
          # Pinned official LunarG installer (same approach as llama.cpp's
          # Windows vulkan CI); installs to C:\VulkanSDK\<version>, which
          # build_windows.ps1 discovers via VULKAN_SDK.
          curl.exe -o $env:RUNNER_TEMP\VulkanSDK-Installer.exe -L `
            "https://sdk.lunarg.com/sdk/download/$env:VULKAN_SDK_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_SDK_VERSION.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\$env:VULKAN_SDK_VERSION"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\$env:VULKAN_SDK_VERSION\bin"

      - name: Build (all targets)
        shell: pwsh
        run: |
          .\scripts\build_windows.ps1 `
            -Preset "${{ matrix.preset }}" `
            -Target "" `
            -BuildTests "${{ matrix.build_tests }}"

      - name: Test
        if: ${{ matrix.run_tests }}
        shell: pwsh
        run: |
          ctest --test-dir "build/${{ matrix.preset }}" --output-on-failure --timeout 600

  # Manual-dispatch only, like llama.cpp's build-cuda-windows.yml ("very
  # heavy on the CI"): the runner image ships no CUDA toolkit, so the job
  # installs one first.
  cuda:
    name: cuda (x64)
    runs-on: windows-2025
    timeout-minutes: 120
    if: ${{ github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install CUDA toolkit
        shell: pwsh
        run: |
          # The runner image has no CUDA toolkit. 12.9.0 matches the
          # Dockerfile pin; the choco package installs the standard
          # C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.9.0
          # layout, which build_windows.ps1 discovers automatically.
          # (Fallback if the choco package misbehaves: the NVIDIA redist
          # zip approach, see llama.cpp's .github/actions/windows-setup-cuda.)
          choco install cuda -y --version=12.9.0.576

      - name: Build (all targets)
        shell: pwsh
        run: |
          # Explicit arch: the runner has no GPU, so 'auto' (nvidia-smi)
          # would find nothing and 'native' would fall back to sm_75
          # (see wip/ci-bugs-found.md #1).
          .\scripts\build_windows.ps1 `
            -Preset windows-cuda-release `
            -Target "" `
            -BuildTests OFF `
            -CudaArchitectures 89
