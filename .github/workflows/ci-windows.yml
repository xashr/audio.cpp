# CI (windows)
#
# Builds and tests the engine on Windows (Visual Studio / MSVC, Ninja):
#   - cpu:    build + ctest (the Windows CPU job is the only one that runs
#             tests; vulkan/cuda jobs are build-only, as on Linux)
#   - vulkan: Vulkan SDK installed via choco, build only
#   - cuda:   CUDA toolkit preinstalled on the runner image, build only
#
# Compiler flags mirror scripts/build_windows.ps1 (/utf-8, MSVC OpenMP).
# ccache is intentionally not used on Windows (MSVC+ccache works, but it is
# unproven here; add later if the jobs get slow).
#
# The old windows-build.yml is kept until this workflow is proven green.

name: CI (windows)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
      - 'ci/**'
    paths:
      - '.github/workflows/ci-windows.yml'
      - '**/CMakeLists.txt'
      - '**/.cmake'
      - '**/*.h'
      - '**/*.hpp'
      - '**/*.c'
      - '**/*.cpp'
      - '**/*.cu'
      - '**/*.cuh'
      - 'model_specs/*.json'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - '.github/workflows/ci-windows.yml'
      - '**/CMakeLists.txt'
      - '**/.cmake'
      - '**/*.h'
      - '**/*.hpp'
      - '**/*.c'
      - '**/*.cpp'
      - '**/*.cu'
      - '**/*.cuh'
      - 'model_specs/*.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: windows-2025
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cpu (x64)
            enable_vulkan: "OFF"
            enable_cuda: "OFF"
            run_tests: true
          - name: vulkan (x64)
            enable_vulkan: "ON"
            enable_cuda: "OFF"
            run_tests: false
          - name: cuda (x64)
            enable_vulkan: "OFF"
            enable_cuda: "ON"
            run_tests: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies (vulkan)
        if: ${{ matrix.enable_vulkan == 'ON' }}
        shell: pwsh
        run: |
          choco install vulkansdk --no-progress
          # CMake's FindVulkan picks this up
          $sdk = Get-ChildItem "C:\VulkanSDK" | Sort-Object Name -Descending | Select-Object -First 1
          "VULKAN_SDK=$($sdk.FullName)" >> $env:GITHUB_ENV

      - name: Configure
        shell: pwsh
        run: |
          $configureArgs = @(
            "-S", ".", "-B", "build", "-G", "Ninja",
            "-DCMAKE_BUILD_TYPE=Release",
            "-DENGINE_BUILD_TESTS=ON",
            "-DCMAKE_C_FLAGS=/utf-8",
            "-DCMAKE_CXX_FLAGS=/utf-8 /EHsc",
            "-DOpenMP_C_FLAGS=/openmp:experimental",
            "-DOpenMP_CXX_FLAGS=/openmp:experimental",
            "-DENGINE_ENABLE_VULKAN=${{ matrix.enable_vulkan }}",
            "-DENGINE_ENABLE_CUDA=${{ matrix.enable_cuda }}"
          )
          if ("${{ matrix.enable_cuda }}" -eq "ON") {
            # Explicit arch: the runner has no GPU, so 'native' would
            # fall back to sm_75 (see wip/ci-bugs-found.md #1).
            $configureArgs += "-DCMAKE_CUDA_ARCHITECTURES=89"
          }
          cmake @configureArgs

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --parallel

      - name: Test
        if: ${{ matrix.run_tests }}
        shell: pwsh
        working-directory: build
        run: |
          ctest --output-on-failure --timeout 600
