# CI (linux)
#
# Builds and tests the engine on Linux for each backend:
#   - cpu:    x64 (build + ctest) and arm64 (build only, see below)
#   - vulkan: x64 + arm64, build only (no GPU on runners)
#   - cuda:   x64 in an nvidia/cuda container (no GPU), build only
#
# The CUDA container job compile-verifies the CUDA code paths (including
# the test sources). ctest only runs on the CPU job because several tests
# select their backend at compile time (GGML_USE_CUDA / GGML_USE_VULKAN)
# and require a real device, which GitHub runners do not have.
#
# Deferred (not covered by the old CI, so not regressions; tracked in
# wip/ci-bugs-found.md):
#   - ctest on arm64: 7 audio-math tests fail on arm64 while passing on
#     x64 (genuine computation differences). The arm64 cpu job is
#     build-only until that is fixed (future task FT-1).
#   - HIP: build fails with rocm/dev-ubuntu-24.04:6.4.4 (compile error,
#     configure succeeds). Job removed until diagnosed (future task FT-2);
#     candidate fallback image: rocm/dev-ubuntu-22.04:6.1.2.
#
# The old linux-build.yml is kept until this workflow is proven green.

name: CI (linux)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
      - 'ci/**'
    paths:
      - '.github/workflows/ci-linux.yml'
      - '**/CMakeLists.txt'
      - '**/.cmake'
      - '**/*.h'
      - '**/*.hpp'
      - '**/*.c'
      - '**/*.cpp'
      - '**/*.cu'
      - '**/*.cuh'
      - 'model_specs/*.json'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - '.github/workflows/ci-linux.yml'
      - '**/CMakeLists.txt'
      - '**/.cmake'
      - '**/*.h'
      - '**/*.hpp'
      - '**/*.c'
      - '**/*.cpp'
      - '**/*.cu'
      - '**/*.cuh'
      - 'model_specs/*.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cpu (x64)
            runs_on: ubuntu-24.04
            enable_vulkan: "OFF"
            run_tests: true
            ccache_key: linux-x64-cpu
          - name: cpu (arm64)
            runs_on: ubuntu-24.04-arm
            enable_vulkan: "OFF"
            # TODO (FT-1): 7 ctest failures on arm64 (audio math; pass on
            # x64) - see wip/ci-bugs-found.md #5. Re-enable once fixed.
            run_tests: false
            ccache_key: linux-arm64-cpu
          - name: vulkan (x64)
            runs_on: ubuntu-24.04
            enable_vulkan: "ON"
            run_tests: false
            ccache_key: linux-x64-vulkan
          - name: vulkan (arm64)
            runs_on: ubuntu-24.04-arm
            enable_vulkan: "ON"
            run_tests: false
            ccache_key: linux-arm64-vulkan

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # ccache only where a warm cache can exist (see ci-macos.yml note):
      # main/dev pushes save it, PRs read it; test-branch pushes skip it.
      - name: ccache
        if: >-
          github.event_name == 'pull_request' ||
          (github.event_name == 'push' &&
           (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'))
        uses: ggml-org/ccache-action@v1.2.21
        with:
          key: ${{ matrix.ccache_key }}
          evict-old-files: 1d
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Install dependencies (vulkan)
        if: ${{ matrix.enable_vulkan == 'ON' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            glslc libvulkan-dev spirv-headers

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DENGINE_BUILD_TESTS=ON \
            -DENGINE_ENABLE_VULKAN=${{ matrix.enable_vulkan }}

      - name: Build
        run: |
          cmake --build build --parallel "$(nproc)"

      - name: Test
        if: ${{ matrix.run_tests }}
        run: |
          cd build
          # Per-test timeouts are set in CMake (600 s default, 1800 s for the
          # heavy supertonic test); a global --timeout would override them.
          ctest --output-on-failure

  cuda:
    name: CUDA (x64)
    runs-on: ubuntu-24.04
    container: nvidia/cuda:12.6.2-devel-ubuntu24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt update
          apt install -y --no-install-recommends \
            build-essential cmake ninja-build git libgomp1

      - name: ccache
        if: >-
          github.event_name == 'pull_request' ||
          (github.event_name == 'push' &&
           (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'))
        uses: ggml-org/ccache-action@v1.2.21
        with:
          key: linux-x64-cuda
          evict-old-files: 1d
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # Single explicit architecture: keeps the job fast and deterministic
      # (CMAKE_CUDA_ARCHITECTURES=native would fall back to sm_75 on a
      # GPU-less runner). The published multi-arch images come from the
      # Docker workflow instead.
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_ARCHITECTURES=89 \
            -DENGINE_ENABLE_CUDA=ON \
            -DENGINE_BUILD_TESTS=ON

      - name: Build
        run: |
          cmake --build build --parallel "$(nproc)"
