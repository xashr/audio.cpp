# CI (nix)
#
# Builds the Nix flake packages:
#   linux x64:  cpu, vulkan, python-scripts
#   macos arm64: metal
#
# nixpkgs is pinned via the committed flake.lock, so builds are reproducible.
#
# Deferred (future tasks): cuda/rocm/rocm-gfx1151 packages were never built
# in CI before (the old nix-build.yml only covered cpu+vulkan), and the
# toolkit stacks they build from nixpkgs are very heavy; aarch64-linux
# cross-builds are not covered yet either. See wip/ci-bugs-found.md / the
# handoff FT list (FT-4, FT-5).
#
# The old nix-build.yml is kept until this workflow is proven green.

name: CI (nix)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
      - 'ci/**'
    paths:
      - '.github/workflows/ci-nix.yml'
      - 'flake.nix'
      - 'flake.lock'
      - '.devops/nix/*'
      - '**/CMakeLists.txt'
      - '**/.cmake'
      - '**/*.h'
      - '**/*.hpp'
      - '**/*.c'
      - '**/*.cpp'
      - '**/*.cu'
      - '**/*.cuh'
      - 'model_specs/*.json'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - '.github/workflows/ci-nix.yml'
      - 'flake.nix'
      - 'flake.lock'
      - '.devops/nix/*'
      - '**/CMakeLists.txt'
      - '**/.cmake'
      - '**/*.h'
      - '**/*.hpp'
      - '**/*.c'
      - '**/*.cpp'
      - '**/*.cu'
      - '**/*.cuh'
      - 'model_specs/*.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cpu (linux x64)
            package: cpu
            runs_on: ubuntu-24.04
          - name: vulkan (linux x64)
            package: vulkan
            runs_on: ubuntu-24.04
          - name: python-scripts (linux x64)
            package: python-scripts
            runs_on: ubuntu-24.04
          # TODO (FT-5): re-add cuda / rocm / rocm-gfx1151 once their
          # nixpkgs toolkit builds are proven (heavy; never in CI before).
          - name: metal (macos arm64)
            package: metal
            runs_on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Build ${{ matrix.package }}
        run: |
          nix build ".#${{ matrix.package }}"
