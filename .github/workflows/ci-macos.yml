# CI (macos)
#
# Builds and tests the engine on macOS for each backend:
#   - metal (arm64): macos-latest (Apple silicon), Metal ON (the Apple default)
#   - cpu (x64):     macos-15-intel, Metal OFF
#
# Runner notes:
#   - macos-15-intel is a hard pin: Apple ended Intel Mac support with macOS 15,
#     so there is no newer x64 runner to move to (llama.cpp pins it too).
#     The Intel runner pool is small: the x64 job can wait a long time for a
#     runner (observed 2h+ on 2026-08-15). If that becomes chronic, drop the
#     x64 job (arm64 is the primary macOS platform) - future task candidate.
#   - macos-latest is used (not pinned) so the arm64 job tracks the current
#     Apple silicon runner.
#
# ctest runs on both jobs: no test requires a GPU/Metal device at runtime
# (compile-time backend selection only applies to CUDA/Vulkan builds, which
# this workflow does not enable).
#
# OpenMP is OFF: AppleClang has no OpenMP runtime (find_package(OpenMP)
# fails) - the same workaround the old mac-build.yml used.
#
# Build parallelism is capped at 4: uncapped `--parallel` (= CPU count) plus
# the make/ccache/clang process tree exhausted the runner user's process
# limit on 2026-08-16 ("clang++: error: unable to execute command:
# posix_spawn failed: Resource temporarily unavailable"). The cap also keeps
# capped builds well inside the generous per-job timeouts below.
# The Build step prints ulimits/process counts so the limits can be re-tuned
# from the logs.

# The old mac-build.yml is kept until this workflow is proven green.

name: CI (macos)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
      - 'ci/**'
    paths:
      - '.github/workflows/ci-macos.yml'
      - '**/CMakeLists.txt'
      - '**/.cmake'
      - '**/*.h'
      - '**/*.hpp'
      - '**/*.c'
      - '**/*.cpp'
      - '**/*.metal'
      - 'model_specs/*.json'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - '.github/workflows/ci-macos.yml'
      - '**/CMakeLists.txt'
      - '**/.cmake'
      - '**/*.h'
      - '**/*.hpp'
      - '**/*.c'
      - '**/*.cpp'
      - '**/*.metal'
      - 'model_specs/*.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: metal (arm64)
            runs_on: macos-latest
            enable_metal: "ON"
            ccache_key: macos-arm64-metal
            timeout_minutes: 240
          - name: cpu (x64)
            runs_on: macos-15-intel
            enable_metal: "OFF"
            ccache_key: macos-x64-cpu
            timeout_minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # ccache only where a warm cache can exist (pushes to main/dev save it,
      # PRs read it). On ci/** test-branch pushes it would be cold pure
      # overhead and its extra per-compile process fan-out aggravated the
      # macOS posix_spawn limit failure (2026-08-16).
      - name: ccache
        if: >-
          github.event_name == 'pull_request' ||
          (github.event_name == 'push' &&
           (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'))
        uses: ggml-org/ccache-action@v1.2.21
        with:
          key: ${{ matrix.ccache_key }}
          evict-old-files: 1d
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DENGINE_BUILD_TESTS=ON \
            -DENGINE_ENABLE_METAL=${{ matrix.enable_metal }} \
            -DENGINE_ENABLE_OPENMP=OFF \
            -DGGML_OPENMP=OFF

      - name: Build
        run: |
          # Diagnostics: the 2026-08-16 posix_spawn EAGAIN failure - if it
          # recurs, these lines show the actual limits and process count.
          ulimit -a
          sysctl kern.maxproc kern.maxprocperuid 2>/dev/null || true
          ps -A | wc -l
          # Raise the soft file-descriptor limit (spawn also consumes FDs);
          # no-op if already at the hard limit.
          ulimit -n 10240 2>/dev/null || true
          # Capped parallelism: see header (process-limit exhaustion).
          cmake --build build --parallel 4

      - name: Test
        run: |
          cd build
          ctest --output-on-failure --timeout 600
