# CI (docker)
#
# Validates that the published Dockerfiles build — and the resulting image
# runs — on every PR (and push) that could break them. Validation only:
# local buildx build, no login, no push, no ghcr cache writes. The daily
# docker.yml remains the sole publisher.
#
# Scope:
#   - native amd64 only (no qemu cross-builds; multi-arch is docker.yml's job)
#   - the `full` target of each published image (cpu / cuda12 / cuda13),
#     with the same build args as docker.yml
#   - a runtime smoke test after the build (catches broken runtime deps,
#     missing libs, bad COPYs — things the build stage cannot see)
#
# CUDA archs: PR validation only needs one arch to prove the Dockerfile,
# cmake configure, compilation and runtime stage work — the CUDA jobs pin
# CUDA_DOCKER_ARCH=89-real (the arg added by upstream #280), consistent with
# the ci-linux (89) and ci-windows (89) jobs. The full portable default arch
# list (what docker.yml actually publishes) is validated by the daily
# docker.yml build itself, which would visibly fail there if it broke.

name: CI (docker)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
      - 'ci/**'
    paths:
      - '.github/workflows/ci-docker.yml'
      - '.devops/**'
      - '**/CMakeLists.txt'
      - '**/.cmake'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - '.github/workflows/ci-docker.yml'
      - '.devops/**'
      - '**/CMakeLists.txt'
      - '**/.cmake'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: validate (${{ matrix.name }}, amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cpu
            dockerfile: .devops/cpu.Dockerfile
            cuda_version: ""
          - name: cuda12
            dockerfile: .devops/cuda.Dockerfile
            cuda_version: "12.9.2"
          - name: cuda13
            dockerfile: .devops/cuda.Dockerfile
            cuda_version: "13.3.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: full
          platforms: linux/amd64
          # Single platform → load into the local daemon for the smoke test.
          load: true
          tags: local/audiocpp-validate-${{ matrix.name }}:ci
          # Only the args that affect build content; label args keep the
          # Dockerfile defaults (this is a validation build). One build arg
          # per line — docker/build-push-action parses each line as KEY=VALUE.
          build-args: |
            APP_VERSION=${{ github.sha }}
            APP_REVISION=${{ github.sha }}
            ${{ matrix.cuda_version && format('CUDA_VERSION={0}', matrix.cuda_version) || '' }}
            ${{ matrix.cuda_version && 'CUDA_DOCKER_ARCH=89-real' || '' }}
          # GHA cache: read-only for fork PRs (no cache poisoning).
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (runtime image)
        run: |
          # Bypasses the entrypoint multiplexer and checks the runtime stage
          # directly: binary present, shared libraries resolvable, no missing
          # runtime deps.
          docker run --rm \
            --entrypoint /app/audiocpp_cli \
            local/audiocpp-validate-${{ matrix.name }}:ci --help
